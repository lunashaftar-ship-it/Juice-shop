<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tellus - Succhi Naturali</title>
    <!-- تضمين مكتبة Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-800">

    <!-- Hero Section -->
    <section class="relative min-h-screen flex flex-col justify-between py-12 px-6 sm:px-12 lg:px-24 bg-white">
        
        <!-- المحتوى الرئيسي للواجهة (يسار ويمين) -->
        <div class="max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-12 items-center my-auto">
            
            <!-- القسم الأيسر: الاسم، العنوان، الوصف، وزر التسوق -->
            <div class="lg:col-span-7 space-y-6 text-left z-10">
                <!-- اسم البراند / القسم -->
                <span class="text-sm font-semibold tracking-widest text-green-700 uppercase">
                    Tellus Succhi Naturali
                </span>
                
                <!-- العنوان الرئيسي -->
                <h1 class="text-4xl sm:text-5xl lg:text-6xl font-bold tracking-tight text-gray-900 leading-tight">
                    Il sapore autentico della natura in ogni sorso.
                </h1>
                
                <!-- الفقرة أو الوصف -->
                <p class="text-lg text-gray-600 max-w-xl">
                    Scopri la nostra selezione esclusiva di succhi freschi e naturali, spremuti a freddo per offrirti il massimo del benessere e della qualità direttamente dalla terra.
                </p>
                
                <!-- زر التسوق -->
                <div class="pt-4">
                    <a href="#shop" class="inline-block bg-green-700 hover:bg-green-800 text-white font-medium px-8 py-4 rounded-full shadow-lg transition duration-300 transform hover:-translate-y-0.5">
                        Acquista Ora
                    </a>
                </div>
            </div>

            <!-- القسم الأيمن: صورة العصير والخلفية الخاصة به -->
            <div class="lg:col-span-5 flex justify-center items-center relative">
                <div class="w-full h-auto flex items-center justify-center">
                    <!-- استبدل رابط الصورة هنا برابط صورتك المطلوبة -->
                    <img src="URL_OF_YOUR_IMAGE_HERE" alt="Tellus Succhi Naturali" class="w-full max-w-md lg:max-w-lg object-contain drop-shadow-sm">
                </div>
            </div>

        </div>

        <!-- القسم الأسفل: مكان الشعار (Logo) -->
        <div class="max-w-7xl mx-auto w-full pt-8 border-t border-gray-100 flex justify-center lg:justify-start items-center">
            <div class="flex items-center space-x-3">
                <!-- مكان الشعار -->
                <div class="h-10 w-32 bg-gray-50 border border-gray-200 rounded flex items-center justify-center text-xs text-gray-400 font-medium">
                    [ Logo Here ]
                </div>
            </div>
        </div>

    </section>

</body>
</html>
